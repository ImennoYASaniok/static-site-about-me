<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino Run — Игры</title>
    <link rel="stylesheet" href="/src/styles/main.scss">
    <script type="module" src="/src/main.js"></script>
</head>
<body data-game="dino">
    <div class="page-shell">
        <header class="site-header">
            <nav class="site-nav">
                <a href="../index.html" class="nav-link">Главная</a>
                <a href="../about.html" class="nav-link">Обо мне</a>
                <a href="../projects.html" class="nav-link">Проекты</a>
                <a href="../contacts.html" class="nav-link">Контакты</a>
            </nav>
        </header>

        <main>
            <section class="hero hero-small">
                <div class="hero-body">
                    <span class="hero-label">Dino Run</span>
                    <h1>Игра-раннер на отдельной странице.</h1>
                    <p class="hero-copy">Прыгай через препятствия и соревнуйся за лучший результат.</p>
                    <div class="hero-actions">
                        <a href="../games.html" class="btn btn-primary">К каталогу игр</a>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="game-display fade-up delay-1">
                    <div class="game-info">
                        <h3 id="gameTitle"></h3>
                        <p id="gameDescription"></p>
                        <div id="gameControls"></div>
                    </div>
                    <div class="game-panel">
                        <canvas id="gameCanvas" width="640" height="360"></canvas>
                        <div id="minesweeperGrid" class="game-grid hidden"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
